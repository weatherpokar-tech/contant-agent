name: Weekly content agent
on:
  schedule:
    - cron: "30 2 * * 5"      # Fridays 02:30 UTC = 08:00 India time
  workflow_dispatch:            # lets you press "Run workflow" manually
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scrape, build dashboard, send Telegram report
        run: python3 scripts/run.py
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save updated dashboard
        run: |
          git config user.name "content-agent-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs dashboard
          git diff --cached --quiet || git commit -m "Update dashboard"
          git push
